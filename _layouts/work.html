---
layout: null
title: "{{ page.title }} · {{ site.title }}"
---
<!doctype html>
<html lang="{{ page.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title }} · {{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: page.summary | escape }}">
  <link rel="stylesheet" href="https://fonts.cdnfonts.com/css/switzer">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/site.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/site-shell.css' | relative_url }}">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html { font-size: 16px; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
    body { margin: 0; background: #000; color: #fff; font-family: 'Switzer', 'Inter', system-ui, -apple-system, sans-serif; overflow-x: hidden; }
    .work-page { padding-top: 8rem; }
    .work-header, .work-content { width: min(100% - 2rem, 980px); margin-inline: auto; }
    .work-header { padding-block: 1.5rem 4rem; }
    .work-home { text-decoration: none; }
    .work-category { margin: 4rem 0 1rem; color: #a1ff00; }
    .work-header h1 { max-width: 13ch; margin: 0; font-size: clamp(3rem, 9vw, 7rem); line-height: .92; letter-spacing: -.06em; }
    .work-cover { display: block; width: 100%; max-height: 80vh; object-fit: cover; }
    .work-content { padding-block: 4rem 8rem; font-size: clamp(1.1rem, 2vw, 1.45rem); line-height: 1.55; }
    .work-content > * { max-width: 760px; }
    .work-content img { max-width: 100%; height: auto; }
    .work-page .site-nav { position: fixed; }
    .work-page .site-footer { margin-top: 4rem; }
  </style>
</head>
<body id="top">
  {% include site-nav.html %}
  <main class="work-page">
    <header class="work-header">
      <a class="work-home" href="{{ '/' | relative_url }}">Nuclear</a>
      <p class="work-category">{{ page.category }}</p>
      <h1>{{ page.title }}</h1>
    </header>
    <img class="work-cover" src="{{ page.image | relative_url }}" alt="{{ page.image_alt | default: page.title | escape }}">
    <article class="work-content">{{ content }}</article>
  </main>
  {% include site-footer.html %}
  <script src="{{ '/site-shell.js' | relative_url }}" defer></script>
</body>
</html>
